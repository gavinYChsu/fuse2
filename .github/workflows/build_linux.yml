name: Build Linux Executable

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, cuda]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        
        # Select requirements file based on variant
        if [ "${{ matrix.variant }}" == "cuda" ]; then
          REQUIREMENTS_FILE="requirements-cuda.txt"
        else
          REQUIREMENTS_FILE="requirements.txt"
        fi
        
        if [ -f "$REQUIREMENTS_FILE" ]; then pip install -r "$REQUIREMENTS_FILE"; fi
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # Build with variant name
        pyinstaller --name fuse_linux_${{ matrix.variant }} --onefile --clean --add-data "fuse:fuse" run.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: fuse_linux_${{ matrix.variant }}_executable
        path: dist/fuse_linux_${{ matrix.variant }}
